name: RLS tests

# Every pull request runs the permission suite. A change that weakens a
# policy fails CI before anyone has to notice it in review.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  rls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Postgres 16 and pgTAP
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-16-pgtap libtap-parser-sourcehandler-pgtap-perl
          sudo systemctl start postgresql

      - name: Run migration and tests
        run: |
          sudo cp -r "$GITHUB_WORKSPACE" /tmp/repo
          sudo chown -R postgres /tmp/repo
          sudo -u postgres bash -c 'cd /tmp/repo && DATABASE_URL=postgres:///postgres ./scripts/test-local.sh'
